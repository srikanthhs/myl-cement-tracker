<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- full bleed background for maskable (safe zone is inner 80%) -->
  <rect width="192" height="192" fill="#1a73e8"/>
  <!-- building outline (shifted inward for safe zone) -->
  <rect x="44" y="88" width="104" height="68" rx="5" fill="none" stroke="white" stroke-width="7"/>
  <!-- door -->
  <rect x="82" y="122" width="28" height="34" rx="3" fill="white" opacity="0.9"/>
  <!-- roof -->
  <polygon points="34,90 96,44 158,90" fill="none" stroke="white" stroke-width="7" stroke-linejoin="round"/>
  <!-- cement bag -->
  <rect x="58" y="102" width="30" height="18" rx="3" fill="white" opacity="0.85"/>
  <line x1="58" y1="111" x2="88" y2="111" stroke="#1a73e8" stroke-width="2.5"/>
  <!-- text -->
  <text x="96" y="178" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif" fill="white" letter-spacing="3">MYL</text>
</svg>
