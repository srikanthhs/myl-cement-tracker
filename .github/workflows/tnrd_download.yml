name: TNRD Excel Downloader

on:
  # ── Scheduled runs (IST = UTC+5:30) ─────────────────────────────────────
  # 02:30 UTC = 08:00 IST   08:30 UTC = 14:00 IST   15:00 UTC = 20:30 IST
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST – morning
    - cron: '30 8 * * *'   # 14:00 IST – afternoon
    - cron: '0 15 * * *'   # 20:30 IST – evening

  # ── Manual trigger ───────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      report_id:
        description: 'Run a single report by ID (leave blank for all)'
        required: false
        default: ''

jobs:
  download:
    name: Download TNRD Excel Reports
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run downloader – all reports
        if: ${{ github.event.inputs.report_id == '' }}
        env:
          TNRD_USERNAME:                ${{ secrets.TNRD_USERNAME }}
          TNRD_PASSWORD:                ${{ secrets.TNRD_PASSWORD }}
          TWOCAPTCHA_API_KEY:           ${{ secrets.TWOCAPTCHA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          TNRD_SAVE_LOCAL: 'false'
        run: python scripts/tnrd_downloader.py --now

      - name: Run downloader – single report
        if: ${{ github.event.inputs.report_id != '' }}
        env:
          TNRD_USERNAME:                ${{ secrets.TNRD_USERNAME }}
          TNRD_PASSWORD:                ${{ secrets.TNRD_PASSWORD }}
          TWOCAPTCHA_API_KEY:           ${{ secrets.TWOCAPTCHA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          TNRD_SAVE_LOCAL: 'false'
        run: python scripts/tnrd_downloader.py --id "${{ github.event.inputs.report_id }}"

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tnrd-debug-${{ github.run_number }}
          path: scripts/downloaded_excels/
          retention-days: 3
